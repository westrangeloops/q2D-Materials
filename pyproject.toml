[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "q2D-Materials"
version = "0.4.0"
description = "Template-driven toolkit for stacking quasi-2D perovskite architectures"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "q2D-Materials contributors" }]
keywords = ["perovskite", "materials-science", "crystallography", "ase", "2D"]
dependencies = [
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "scipy>=1.7.0",
  "ase>=3.22.0",
  "pymatgen>=2022.0.0",
  "rdkit>=2022.0.0",
  "matplotlib>=3.5.0",
  "scikit-learn>=1.0.0",
  "networkx>=2.6.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "pydantic>=2.0.0",
  "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=6.0.0",
  "pytest-cov>=2.12.0",
  "ipython>=7.0.0",
  "jupyter>=1.0.0",
]
viz = [
  "seaborn>=0.11.0",
  "pyvis",
  "graphviz",
  "streamlit",
]

[tool.setuptools.packages.find]
include = ["q2D_Materials*"]

[tool.setuptools.package-data]
q2D_Materials = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# Scripts under tests/ that are not collectable pytest modules
filterwarnings = [
  "ignore::UserWarning",
]
collect_ignore = [
  "tests/test_graph_expoert.py",
  "tests/test_modifier.py",
]
