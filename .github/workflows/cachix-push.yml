name: Cachix Push

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  build-and-cache:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    defaults:
      run:
        shell: devenv shell bash -- -e {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Set up Cachix for q2d-materials
        uses: cachix/cachix-action@v12
        with:
          name: q2d-materials
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipNixBuild: false

      - name: Install devenv
        shell: bash
        run: nix profile install nixpkgs#devenv

      - name: Build devenv shell and run checks
        run: devenv test

      - name: Verify environment setup
        run: |
          echo "🎉 Development environment built successfully!"
          echo "Python version:"
          python --version
          echo ""
          echo "✅ Pre-compiled binaries are now cached in Cachix"
          echo "💾 Contributors will benefit from faster setup times!"

      - name: Run tests
        run: pytest tests/ -v

      - name: Success summary
        if: success()
        run: |
          echo "✅ Build and cache successful!"
          echo "📦 Cache: q2d-materials.cachix.org"
          echo "🚀 Contributors can now use pre-compiled binaries"

